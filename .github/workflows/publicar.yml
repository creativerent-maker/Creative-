# Publica la web en el hosting de Webempresa por FTP cada vez que cambia la rama main
# (por ejemplo, al guardar un trabajo desde el panel /admin).
#
# Seguridad: mientras la variable del repositorio DESTINO no valga "produccion",
# solo se publica la versión de PRUEBAS (con contenido de ejemplo y oculta a Google)
# en la carpeta FTP_DIR_PRUEBAS. La web actual de creativerent.es no se toca.
#
# Secretos (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR_PRUEBAS, FTP_DIR_PRODUCCION
# Variable (… → Variables): DESTINO = pruebas | produccion
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PRODUCCION: ${{ vars.DESTINO == 'produccion' }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build de pruebas
        if: env.PRODUCCION != 'true'
        run: npm run build

      - name: Build de producción
        if: env.PRODUCCION == 'true'
        run: npm run build:prod

      - name: Subir a Webempresa (pruebas)
        if: env.PRODUCCION != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR_PRUEBAS }}

      - name: Subir a Webempresa (producción)
        if: env.PRODUCCION == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR_PRODUCCION }}
